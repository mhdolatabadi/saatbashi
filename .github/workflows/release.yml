name: Build and release APK

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.2.0), for manual runs not triggered by a tag push'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Determine immutable release version
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # A rerun keeps its number; parallel merges cannot allocate the same version.
          code=$((BUILD_NUMBER + 2))
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            tag="v1.2.${code}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]}. See docs/android-release.md." >&2
            exit 1
          fi

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Tolerate how the secret is usually pasted: wrapped lines, Windows line endings, or
          # certutil's BEGIN/END lines. Anything else that is not base64 is a wrong value.
          keystore="$RUNNER_TEMP/atid-release.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | grep -v -- '-----' | tr -d ' \t\r\n' | base64 --decode > "$keystore" \
            || [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 of the keystore. Re-create it with 'base64 -w0 atid-release.jks' (see docs/android-release.md)." >&2
            exit 1
          fi
          echo "ATID_KEYSTORE_FILE=$RUNNER_TEMP/atid-release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK and bundle
        env:
          ATID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew testDebugUnitTest assembleRelease bundleRelease
          -PreleaseVersionName=${{ steps.release_tag.outputs.version }}
          -PreleaseVersionCode=${{ steps.release_tag.outputs.code }}

      - name: Verify signature and name the APK
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.name }}
          RELEASE_VERSION: ${{ steps.release_tag.outputs.version }}
          RELEASE_CODE: ${{ steps.release_tag.outputs.code }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed release APK was not produced" >&2; exit 1; }
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"
          aapt="$(dirname "$apksigner")/aapt"
          metadata="$("$aapt" dump badging "$apk")"
          grep -Fq "versionCode='$RELEASE_CODE'" <<< "$metadata"
          grep -Fq "versionName='$RELEASE_VERSION'" <<< "$metadata"
          mkdir -p release
          cp "$apk" "release/Saatbashi-${RELEASE_TAG}.apk"
          # Stores that take bundles (Google Play, Cafe Bazaar) get the same signed build as an AAB.
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::Signed release bundle was not produced" >&2; exit 1; }
          jarsigner -verify "$aab" | grep -q 'jar verified'
          cp "$aab" "release/Saatbashi-${RELEASE_TAG}.aab"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/atid-release.jks"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          target_commitish: ${{ steps.release_tag.outputs.sha }}
          make_latest: legacy
          files: |
            release/Saatbashi-${{ steps.release_tag.outputs.name }}.apk
            release/Saatbashi-${{ steps.release_tag.outputs.name }}.aab
          generate_release_notes: true
